
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rana Sanadora</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

:root {
  --pink: #ff8fb8;
  --purple: #a98bfa;
  --green: #83d69b;
  --cream: #fffaf4;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
  overflow-x: hidden;
  background:
    linear-gradient(135deg, rgba(255,239,247,.78), rgba(233,239,255,.72)),
    url('fondo.jpg') center / cover fixed;
  color: #67547d;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 18px;
  position: relative;
  overflow: hidden;
}

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: rgba(255,255,255,.45);
  border-radius: 50%;
  filter: blur(35px);
  pointer-events: none;
}

.glow.one {
  top: -120px;
  left: -100px;
}

.glow.two {
  bottom: -150px;
  right: -100px;
}

header {
  text-align: center;
  z-index: 1;
  animation: appear .9s ease both;
}

.tag {
  display: inline-block;
  background: rgba(255,255,255,.78);
  padding: 9px 18px;
  border-radius: 30px;
  font-size: 13px;
  letter-spacing: 1px;
  color: #9b79c6;
  box-shadow: 0 5px 18px #8e78a31a;
}


h1 {
  font-size: clamp(2.8rem, 8vw, 5.3rem);
  line-height: 1.1;
  margin-top: 18px;
  font-weight: 700;
  letter-spacing: -2px;
  color: #B58AE8;
  -webkit-text-stroke: 1.5px white;
  paint-order: stroke fill;
  text-shadow:
    3px 5px 0 #FFB4D2,
    0 9px 25px #C29DE94D;
}


.subtitle {
  margin-top: 12px;
  font-size: 1.1rem;
  color: #8c789f;
}

.frog-card {
  z-index: 1;
  margin-top: 35px;
  width: min(370px, 92vw);
  padding: 25px 22px 22px;
  text-align: center;
  background: rgba(255,255,255,.70);
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 35px;
  box-shadow:
    0 20px 55px rgba(129,105,166,.15),
    inset 0 0 25px rgba(255,255,255,.5);
  backdrop-filter: blur(12px);
  animation: float 4s ease-in-out infinite;
}

.frog-button {
  position: relative;
  display: flex;
  width: 100%;
  aspect-ratio: 1;
  align-items: center;
  justify-content: center;
  border: none;
  background:
    radial-gradient(circle, #efffe9 0%, #d9f6dc 65%, #c9eecf 100%);
  border-radius: 28px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  transition: transform .2s ease, background .3s ease;
}

.frog-button:hover {
  background:
    radial-gradient(circle, #f5ffed 0%, #d6f9dc 70%);
}

.frog-button:active {
  transform: scale(.94);
}

.frog-button img {
  width: 88%;
  height: 88%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  filter: drop-shadow(0 9px 5px #5d976b25);
  transition: transform .3s cubic-bezier(.2,1.7,.5,1);
}

.frog-button.bounce img {
  transform: scale(1.12) rotate(-5deg);
}

.instruction {
  margin-top: 20px;
  font-size: 1.15rem;
  font-weight: 600;
  color: #8a75a2;
}

.instruction span {
  color: #f28cb5;
}

.counter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 13px;
  background: #fff1f7;
  padding: 9px 16px;
  border-radius: 25px;
  color: #e87fa8;
  font-size: .95rem;
}

.progress {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 15px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e9dcef;
  transition: .3s;
}

.dot.active {
  background: #ff8fb8;
  transform: scale(1.25);
}

.message {
  position: fixed;
  z-index: 10;
  left: 50%;
  top: 50%;
  width: min(340px, 88vw);
  padding: 28px 20px;
  text-align: center;
  background: #fff9fd;
  border: 3px solid white;
  border-radius: 30px;
  box-shadow: 0 20px 80px #55406940;
  transform: translate(-50%, -40%) scale(.3);
  opacity: 0;
  pointer-events: none;
}

.message.show {
  animation: popMessage 2.8s ease forwards;
}

.message h2 {
  color: #f17eac;
  font-size: 2rem;
  line-height: 1.2;
  margin: 12px 0;
}

.message p {
  color: #917ca7;
  font-size: 1rem;
}

.message .star {
  font-size: 2.2rem;
}

.heart {
  position: fixed;
  z-index: 8;
  left: 0;
  top: 0;
  pointer-events: none;
  animation: heartFly 1.2s ease-out forwards;
  will-change: transform, opacity;
}

footer {
  z-index: 1;
  margin-top: 27px;
  font-size: .9rem;
  color: #9885aa;
  text-align: center;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes heartFly {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.3) rotate(0);
  }
  15% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate(
      calc(-50% + var(--dx)),
      calc(-50% + var(--dy))
    ) scale(1.3) rotate(var(--rot));
  }
}

@keyframes popMessage {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(.3) rotate(-8deg); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(3deg); }
  22%, 78% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(.85) rotate(5deg); }
}

@media (max-width: 480px) {
  .page { padding: 28px 14px; }
  .frog-card { margin-top: 27px; padding: 16px; border-radius: 28px; }
  .subtitle { font-size: 1rem; }
  .instruction { font-size: 1.05rem; }
}

@media (prefers-reduced-motion: reduce) {
  .frog-card { animation: none; }
}
</style>
</head>

<body>
<main class="page">
  <div class="glow one"></div>
  <div class="glow two"></div>

  <header>
    <div class="tag">UN PEQUEÑO RINCÓN MÁGICO</div>
    <h1>Rana Sanadora</h1>
    <p class="subtitle">Una ranita, un toque y mucha magia.</p>
  </header>

  <section class="frog-card">
    <button class="frog-button" id="frog" aria-label="Tocar la rana para liberar corazones">
      <img src="rana.png" alt="Una ranita verde adorable">
    </button>

    <p class="instruction">¡Toca a la rana! <span>♥</span></p>

    <div class="counter">
      <span>Toquecitos mágicos:</span>
      <strong id="count">0 / 4</strong>
    </div>

    <div class="progress" aria-label="Progreso hacia el mensaje sorpresa">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </section>

  <footer>Hecho con cariño y magia de ranita</footer>
</main>

<div class="message" id="message" role="status" aria-live="polite">
  <div class="star">✨ 🐸 ✨</div>
  <h2>¡Ten moco de rana!</h2>
  <p>Una dosis de magia para ti.</p>
</div>

<script>
const frog = document.getElementById('frog');
const countText = document.getElementById('count');
const dots = document.querySelectorAll('.dot');
const message = document.getElementById('message');

let count = 0;
let messageTimer;

const heartColors = ['#ff8fb8', '#ffb4d2', '#c2a5ff', '#ff719e', '#ffffff'];

function releaseHearts(x, y, amount = 9) {
  for (let i = 0; i < amount; i++) {
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = Math.random() > 0.2 ? '♥' : '♡';

    const angle = Math.random() * Math.PI * 2;
    const distance = 65 + Math.random() * 125;

    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    heart.style.color = heartColors[
      Math.floor(Math.random() * heartColors.length)
    ];
    heart.style.fontSize = (17 + Math.random() * 23) + 'px';
    heart.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
    heart.style.setProperty('--dy', Math.sin(angle) * distance - 35 + 'px');
    heart.style.setProperty('--rot', (Math.random() * 100 - 50) + 'deg');

    document.body.appendChild(heart);
    heart.addEventListener('animationend', () => heart.remove());
  }
}

function showMessage() {
  clearTimeout(messageTimer);

  message.classList.remove('show');
  void message.offsetWidth;
  message.classList.add('show');

  messageTimer = setTimeout(() => {
    message.classList.remove('show');
  }, 2800);
}

frog.addEventListener('click', () => {
  const rect = frog.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;

  releaseHearts(x, y);

  frog.classList.remove('bounce');
  void frog.offsetWidth;
  frog.classList.add('bounce');

  setTimeout(() => frog.classList.remove('bounce'), 350);

  count++;
  countText.textContent = count + ' / 4';

  dots.forEach((dot, index) => {
    dot.classList.toggle('active', index < count);
  });

  if (count === 4) {
    showMessage();
    releaseHearts(window.innerWidth / 2, window.innerHeight / 2, 22);
    count = 0;
    countText.textContent = '0 / 4';
    dots.forEach(dot => dot.classList.remove('active'));
  }
});
</script>
</body>
</html>
